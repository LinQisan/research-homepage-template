name: Cross-platform checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        node: ['18', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm run build
      - run: npm run check
      - run: python scripts/deploy-ftps.py --dry-run
      # Optional slide tooling is separate from the dependency-free site build.
      - run: python -m pip install -r scripts/requirements-slides.txt
      - run: python -m unittest discover -s scripts/tests -v
